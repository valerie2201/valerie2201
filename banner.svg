<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300">
<style>
.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:14px}
.h{font-family:'Space Grotesk','Segoe UI',Arial,sans-serif}
.l{opacity:0;animation:in .35s forwards}
@keyframes in{to{opacity:1}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sweep{transform-origin:702px 135px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0e1630"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d2a44" stroke-width=".7"/></pattern>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3ee6c4"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
  <linearGradient id="wedge" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3ee6c4" stop-opacity=".05"/><stop offset="1" stop-color="#3ee6c4" stop-opacity=".45"/></linearGradient>
</defs>

<rect width="840" height="300" rx="16" fill="url(#bg)"/>
<rect width="840" height="300" rx="16" fill="url(#grid)" opacity=".7"/>

<!-- terminal -->
<rect x="24" y="24" width="548" height="252" rx="12" fill="#0b1222" stroke="#1d2a44"/>
<path d="M24 36a12 12 0 0 1 12-12h524a12 12 0 0 1 12 12v18H24z" fill="#111a2c"/>
<circle cx="44" cy="40" r="5.5" fill="#ff5f57"/><circle cx="62" cy="40" r="5.5" fill="#febc2e"/><circle cx="80" cy="40" r="5.5" fill="#28c840"/>
<text x="298" y="44" text-anchor="middle" class="m" font-size="12" fill="#8d9bb8">~/valerie2201 — zsh</text>

<g class="m">
  <text x="44" y="82" class="l" style="animation-delay:.2s" fill="#e8eefc"><tspan fill="#3ee6c4">$</tspan> whoami</text>
  <text x="44" y="102" class="l" style="animation-delay:.6s" fill="#c9d6f2">valerie ingersin · toronto, ca · en/fr</text>
  <text x="44" y="130" class="l" style="animation-delay:1.1s" fill="#e8eefc"><tspan fill="#3ee6c4">$</tspan> cat focus.txt</text>
  <text x="44" y="150" class="l" style="animation-delay:1.5s" fill="#8d9bb8"><tspan fill="#3ee6c4">SOC</tspan> · <tspan fill="#3ee6c4">GRC</tspan> · <tspan fill="#3ee6c4">fraud &amp; risk</tspan> · <tspan fill="#3ee6c4">IT security</tspan></text>
  <text x="44" y="178" class="l" style="animation-delay:2s" fill="#e8eefc"><tspan fill="#3ee6c4">$</tspan> ls ~/shipped</text>
  <text x="44" y="198" class="l" style="animation-delay:2.4s" fill="#8b7bff">jexsy/   flappy-dodo/   ai-paper-trading-lab/</text>
  <text x="44" y="226" class="l" style="animation-delay:2.9s" fill="#e8eefc"><tspan fill="#3ee6c4">$</tspan> status</text>
  <text x="44" y="246" class="l" style="animation-delay:3.3s" fill="#c9d6f2"><tspan fill="#28c840">●</tspan> open to entry-level security roles</text>
  <g class="l" style="animation-delay:3.7s"><text x="44" y="266" fill="#3ee6c4">$</text><rect x="58" y="255" width="9" height="15" fill="#3ee6c4" class="cur"/></g>
</g>

<!-- radar -->
<g fill="none" stroke="#3ee6c4">
  <circle cx="702" cy="135" r="90" stroke-opacity=".35"/>
  <circle cx="702" cy="135" r="60" stroke-opacity=".22"/>
  <circle cx="702" cy="135" r="30" stroke-opacity=".22"/>
  <path d="M612 135h180M702 45v180" stroke-opacity=".15"/>
</g>
<path class="sweep" d="M702 135L702 45A90 90 0 0 1 759.9 66.1Z" fill="url(#wedge)"/>
<g class="m" font-size="9" fill="#8d9bb8">
  <circle class="blip" cx="742" cy="102" r="3.5" fill="#ff6b7a"/><text x="749" y="99">phish</text>
  <circle class="blip" style="animation-delay:.8s" cx="664" cy="168" r="3.5" fill="#ffb454"/><text x="626" y="184">fraud</text>
  <circle class="blip" style="animation-delay:1.6s" cx="728" cy="186" r="3.5" fill="#8b7bff"/><text x="735" y="196">anomaly</text>
</g>
<text x="702" y="258" text-anchor="middle" class="h" font-size="20" font-weight="700" fill="url(#g)">VALERIE INGERSIN</text>
<text x="702" y="278" text-anchor="middle" class="m" font-size="10" fill="#8d9bb8" letter-spacing="2">FRAUD DESK → SOC</text>
</svg>
